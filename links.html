<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kendall Hunt &amp; The Shooters — Links</title>
<meta name="description" content="All the links for Kendall Hunt and The Shooters: music, merch, shows, booking. Texas country and red dirt from Forney, TX.">
<style>
  :root {
    --bg: #0d0b08;
    --ink: #f5efe4;
    --muted: #a89c86;
    --amber: #e8a33d;
    --amber-dark: #c67f1f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .wrap {
    width: 100%;
    max-width: 520px;
    padding: 40px 20px 32px;
    text-align: center;
  }
  .kicker {
    color: var(--amber);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-size: 0.72rem;
    margin-bottom: 10px;
  }
  h1 {
    font-family: "Arial Black", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 1.7rem;
    line-height: 1.15;
    margin-bottom: 6px;
  }
  .tagline {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 28px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .grid a {
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 2px solid var(--amber);
    border-radius: 16px;
    color: var(--ink);
    text-decoration: none;
    font-weight: 800;
    font-size: 1.02rem;
    line-height: 1.2;
    padding: 8px;
    transition: background 0.15s, color 0.15s, transform 0.15s;
  }
  .grid a small {
    font-weight: 400;
    font-size: 0.68rem;
    color: var(--muted);
    line-height: 1.25;
  }
  .grid a:hover, .grid a:active {
    background: var(--amber);
    color: #14100a;
    transform: scale(1.03);
  }
  .grid a:hover small, .grid a:active small { color: #14100a; }
  footer {
    margin-top: 28px;
    color: var(--muted);
    font-size: 0.8rem;
  }
  footer a { color: var(--amber); text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">Forney, Texas</p>
    <h1>Kendall Hunt<br>&amp; The Shooters</h1>
    <p class="tagline">Texas country &amp; red dirt from Forney, Texas.</p>
    <div class="grid">

      <a href="https://youtube.com/@kendallhuntandtheshooters">YouTube<small>live clips</small></a>
      <a href="https://open.spotify.com/artist/64DI5R9bbIJTLD8GgX17do">Spotify<small>follow us</small></a>
      <a href="https://music.apple.com/us/artist/kendall-hunt-and-the-shooters/1592319567">Apple Music<small>listen</small></a>
      <a href="https://shop.kendallhuntandtheshooters.com">Merch<small>shirts &amp; hats</small></a>
      <a href="https://venmo.com/Kendall-Hunt">Venmo<small>tip the band</small></a>
      <a href="https://kendallhuntandtheshooters.com/#shows">Shows<small>come see us</small></a>
      <a href="mailto:booking@kendallhuntandtheshooters.com">Book Us<small>bars &amp; parties</small></a>
    </div>
    <footer>
      <a href="https://kendallhuntandtheshooters.com">kendallhuntandtheshooters.com</a>
    </footer>
  </div>
</body>
</html>
